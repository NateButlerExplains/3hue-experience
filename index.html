<script>
// Boot cover, before first paint: a deep link into a door or the path must never flash the
// resting lobby's heading and pins on the way in. main.js clears the attribute once the route
// has been applied without animation.
(function () { if (/^#\/(door|path)/.test(location.hash)) document.documentElement.setAttribute('data-lobby-boot', '1'); })();
</script>

<body>

<a class="skip" href="#doors" id="skip">Skip to the doors</a>

<div id="boot" role="status" aria-live="polite">Loading the lobby</div>

<!-- Header -->
<header id="hud">
  <a class="brand" id="brand" href="https://3hue.net" target="_blank" rel="noopener noreferrer" aria-label="3HUE, opens 3hue.net in a new tab">
    <img id="brand-img" src="media/brand/3hue-logo-240.png" srcset="media/brand/3hue-logo-240.png 1x, media/brand/3hue-logo-480.png 2x" width="240" height="94" alt="3HUE Executive Consulting">
  </a>
  <div class="actions" id="hud-actions">
    <button class="btn outline" type="button" id="walk-btn">Take the walk</button>
    <a class="btn primary" id="talk-btn" href="https://3hue.net/contact.html" target="_blank" rel="noopener noreferrer">Talk to our team</a>
  </div>
</header>

<!-- Floor composition. Desktop: display:contents, the stage is fixed and full-bleed. Composed
     (phones, portrait, short): a flex column of heading, the scene band, the rows, the actions. -->
<main id="floor">
  <div id="floor-head">
    <div class="intro" id="intro">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="h1" tabindex="-1"></h1>
      <p class="sub" id="sub"></p>
    </div>
  </div>

  <div id="floor-band">
    <div id="stage">
      <div class="placeholder" id="placeholder" aria-hidden="true" style="background-image:url(data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABsSFBcUERsXFhceHBsgKEIrKCUlKFE6PTBCYFVlZF9VXVtqeJmBanGQc1tdhbWGkJ6jq62rZ4C8ybqmx5moq6T/2wBDARweHigjKE4rK06kbl1upKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKT/wAARCAASACADASIAAhEBAxEB/8QAGQAAAwEBAQAAAAAAAAAAAAAAAAIDAQQF/8QAHRAAAwACAgMAAAAAAAAAAAAAAAECAzESISIyUf/EABUBAQEAAAAAAAAAAAAAAAAAAAEA/8QAFhEBAQEAAAAAAAAAAAAAAAAAABEB/9oADAMBAAIRAxEAPwDwJgeZ7KY0mM4+BTGUlxJzPkUUtvsXIktDREsWzrjQARYyF+wAWjH/2Q==)"></div>
      <div class="experience-stage" id="plate">
        <picture id="picture">
          <img class="scene" id="plate-img" alt="" decoding="async" fetchpriority="high">
        </picture>
        <svg class="arcs" id="arcs" aria-hidden="true"></svg>
        <div class="scene-labels" id="labels" aria-hidden="true"></div>
        <div class="hotspots hidden" id="doors" role="group" aria-label="Customer paths"></div>
        <div id="kiosk-mount"></div>
        <svg class="debug" id="debug" aria-hidden="true" hidden></svg>
      </div>
      <div class="room" id="room" aria-hidden="true"><img class="scene" id="room-img" alt="" decoding="async"><div class="room-pins" id="room-pins"></div></div>
    </div>
  </div>

  <div id="floor-rows"></div>
  <div id="floor-foot"></div>
</main>

<!-- Door panel / path panel -->
<aside id="panel" class="panel" hidden aria-labelledby="panel-h2"></aside>

<!-- Captioned walk -->
<div id="walk" class="walk" hidden></div>
<div id="walk-live" class="sr" aria-live="polite" aria-atomic="true"></div>

<script type="module" src="js/main.js?v=2026-09-10e"></script>
</body>
